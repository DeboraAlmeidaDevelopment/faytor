name: Deploy Faytor to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp sitemap.xml _site/
          cp robots.txt _site/
          cp ads.txt _site/
          cp -r css js views img _site/
          for route in wordcounter jsonformatter base64 gerador-cpf gerador-cnpj gerador-cns gerador-rg gerador-pis gerador-nomes gerador-celular gerador-email gerador-senhas validador-cpf validador-cnpj validador-cns validador-rg validador-pis politica-de-privacidade termos-de-uso contato sobre-nos; do
            mkdir -p "_site/$route"
            cp index.html "_site/$route/index.html"
            sed -i 's#<head>#<head><base href="../">#' "_site/$route/index.html"
          done
          node scripts/build-error-pages.mjs _site
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
