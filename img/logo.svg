<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 174 60" width="100%" height="100%">
  <defs>
    <!-- Gradiente moderno para o ícone -->
    <linearGradient id="faytorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Ícone / Símbolo (Letra F estilizada com formas geométricas de dados/geração) -->
  <g transform="translate(10, 10)">
    <!-- Fundo arredondado do ícone -->
    <rect width="60" height="60" rx="14" fill="url(#faytorGrad)" />
    
    <!-- Traços geométricos representando a letra F e fluxo de dados -->
    <!-- Haste principal do F -->
    <rect x="18" y="15" width="8" height="30" rx="4" fill="#FFFFFF" />
    <!-- Barra superior do F -->
    <rect x="18" y="15" width="24" height="8" rx="4" fill="#FFFFFF" />
    <!-- Barra central do F -->
    <rect x="18" y="26" width="18" height="7" rx="3.5" fill="#FFFFFF" opacity="0.8" />
    <!-- Ponto/Indicador de dados gerados -->
    <circle cx="37" cy="42" r="5" fill="#93C5FD" />
  </g>

  <!-- Texto do Logotipo -->
  <text x="85" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#1E293B" letter-spacing="-0.5">
    Fay<tspan fill="url(#faytorGrad)">tor</tspan>
  </text>
</svg>
