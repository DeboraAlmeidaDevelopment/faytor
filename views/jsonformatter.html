<!-- ==================== SUB-VIEW: FORMATADOR JSON ==================== -->
<section
  x-data="{
    inputJson: '',
    outputJson: '',
    errorMessage: '',
    format(space) {
      this.errorMessage = '';
      try {
        if (!this.inputJson.trim()) {
          this.outputJson = '';
          return;
        }
        let parsed = JSON.parse(this.inputJson);
        this.outputJson = JSON.stringify(parsed, null, space);
      } catch (e) {
        this.errorMessage = 'Erro de Sintaxe JSON: ' + e.message;
        this.outputJson = '';
      }
    },
    minify() {
      this.errorMessage = '';
      try {
        if (!this.inputJson.trim()) {
          this.outputJson = '';
          return;
        }
        let parsed = JSON.parse(this.inputJson);
        this.outputJson = JSON.stringify(parsed);
      } catch (e) {
        this.errorMessage = 'Erro de Sintaxe JSON: ' + e.message;
        this.outputJson = '';
      }
    },
    copyToClipboard() {
      navigator.clipboard.writeText(this.outputJson);
      alert('Copiado para a área de transferência!');
    }
  }"
  class="space-y-6"
  aria-label="Formatador JSON"
>
  <div>
    <span class="text-xs font-semibold text-secondary dark:text-purple-400 uppercase tracking-widest">Desenvolvimento</span>
    <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mt-1">Formatador & Validador JSON</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2">
      Embeleze, organize, valide ou compacte strings JSON em tempo de execução seguro e rápido.
    </p>
  </div>

  <!-- Actions and Errors -->
  <div class="flex flex-wrap gap-3 items-center">
    <button
      @click="format(2)"
      class="bg-primary hover:bg-primary-dark focus:ring-4 focus:ring-primary/50 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition-all shadow-md"
      aria-label="Formatar com espaçamento de 2 espaços"
    >
      Formatar (2 Espaços)
    </button>
    <button
      @click="format(4)"
      class="bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-500/50 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition-all shadow-md"
      aria-label="Formatar com espaçamento de 4 espaços"
    >
      Formatar (4 Espaços)
    </button>
    <button
      @click="minify()"
      class="bg-secondary hover:bg-secondary-dark focus:ring-4 focus:ring-secondary/50 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition-all shadow-md"
      aria-label="Minificar e compactar JSON"
    >
      Minificar / Compactar
    </button>
    <button
      @click="copyToClipboard()"
      class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold px-4 py-2.5 rounded-xl text-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed"
      :disabled="!outputJson"
      aria-label="Copiar JSON formatado para a área de transferência"
    >
      Copiar Resultado
    </button>
  </div>

  <!-- Error Alert -->
  <div
    x-show="errorMessage"
    class="bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 px-4 py-3 rounded-xl text-sm flex items-center space-x-2"
    role="alert"
    aria-live="assertive"
  >
    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <span x-text="errorMessage"></span>
  </div>

  <!-- Dual Text Editors Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Input Panel -->
    <div class="bg-white dark:bg-darkBg-card rounded-2xl border border-slate-200 dark:border-darkBg-border shadow-sm overflow-hidden flex flex-col">
      <div class="px-5 py-3.5 border-b border-slate-200 dark:border-darkBg-border bg-slate-50 dark:bg-slate-800/40">
        <label for="json-input" class="text-sm font-semibold text-slate-700 dark:text-slate-300">JSON de Entrada</label>
      </div>
      <textarea
        id="json-input"
        x-model="inputJson"
        class="w-full h-96 px-5 py-4 bg-transparent border-0 focus:ring-2 focus:ring-primary focus:outline-none font-mono text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 resize-none"
        placeholder='Cole seu JSON bruto aqui, ex:\n{"faytor": "spa", "aprovado": true}'
      ></textarea>
    </div>

    <!-- Output Panel -->
    <div class="bg-white dark:bg-darkBg-card rounded-2xl border border-slate-200 dark:border-darkBg-border shadow-sm overflow-hidden flex flex-col">
      <div class="px-5 py-3.5 border-b border-slate-200 dark:border-darkBg-border bg-slate-50 dark:bg-slate-800/40">
        <label for="json-output" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Resultado Formatado</label>
      </div>
      <textarea
        id="json-output"
        x-model="outputJson"
        readonly
        class="w-full h-96 px-5 py-4 bg-slate-50/50 dark:bg-slate-900/40 border-0 focus:outline-none font-mono text-xs text-slate-800 dark:text-emerald-400 placeholder-slate-400 resize-none"
        placeholder="O resultado formatado aparecerá aqui após o processamento..."
      ></textarea>
    </div>
  </div>
</section>
