<!-- ==================== SUB-VIEW: CONTADOR DE PALAVRAS ==================== -->
<section
  x-data="{
    text: '',
    get stats() {
      let trimmed = this.text.trim();
      let words = trimmed === '' ? 0 : trimmed.split(/\s+/).length;
      let chars = this.text.length;
      let charsNoSpaces = this.text.replace(/\s+/g, '').length;
      let paragraphs = trimmed === '' ? 0 : trimmed.split(/\n+/).length;
      let readTime = Math.ceil(words / 200); // 200 words per minute average reading
      return { words, chars, charsNoSpaces, paragraphs, readTime };
    }
  }"
  class="space-y-6"
  aria-label="Contador de Palavras"
>
  <div>
    <span class="text-xs font-semibold text-primary dark:text-blue-400 uppercase tracking-widest">Utilitário</span>
    <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mt-1">Contador de Palavras</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2">
      Insira ou cole o seu texto abaixo para ver estatísticas detalhadas e tempo estimado de leitura em tempo real.
    </p>
  </div>

  <!-- Counter Stats Cards -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4" aria-live="polite">
    <div class="bg-white dark:bg-darkBg-card p-4 rounded-xl border border-slate-200 dark:border-darkBg-border shadow-sm text-center">
      <span class="text-xs text-slate-400 dark:text-slate-500 font-medium block uppercase tracking-wider">Palavras</span>
      <span class="text-2xl font-extrabold text-primary dark:text-blue-400 block mt-1" x-text="stats.words">0</span>
    </div>
    <div class="bg-white dark:bg-darkBg-card p-4 rounded-xl border border-slate-200 dark:border-darkBg-border shadow-sm text-center">
      <span class="text-xs text-slate-400 dark:text-slate-500 font-medium block uppercase tracking-wider">Caracteres</span>
      <span class="text-2xl font-extrabold text-slate-800 dark:text-slate-100 block mt-1" x-text="stats.chars">0</span>
    </div>
    <div class="bg-white dark:bg-darkBg-card p-4 rounded-xl border border-slate-200 dark:border-darkBg-border shadow-sm text-center">
      <span class="text-xs text-slate-400 dark:text-slate-500 font-medium block uppercase tracking-wider">Sem Espaços</span>
      <span class="text-2xl font-extrabold text-slate-800 dark:text-slate-100 block mt-1" x-text="stats.charsNoSpaces">0</span>
    </div>
    <div class="bg-white dark:bg-darkBg-card p-4 rounded-xl border border-slate-200 dark:border-darkBg-border shadow-sm text-center">
      <span class="text-xs text-slate-400 dark:text-slate-500 font-medium block uppercase tracking-wider">Parágrafos</span>
      <span class="text-2xl font-extrabold text-slate-800 dark:text-slate-100 block mt-1" x-text="stats.paragraphs">0</span>
    </div>
    <div class="bg-white dark:bg-darkBg-card p-4 rounded-xl border border-slate-200 dark:border-darkBg-border shadow-sm text-center col-span-2 md:col-span-1">
      <span class="text-xs text-slate-400 dark:text-slate-500 font-medium block uppercase tracking-wider">Tempo Leitura</span>
      <span class="text-2xl font-extrabold text-secondary dark:text-purple-400 block mt-1" x-text="stats.readTime + ' min'">0 min</span>
    </div>
  </div>

  <!-- Main Text Area -->
  <div class="bg-white dark:bg-darkBg-card rounded-2xl border border-slate-200 dark:border-darkBg-border shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200 dark:border-darkBg-border bg-slate-50 dark:bg-slate-800/40 flex justify-between items-center">
      <label for="wordcounter-textarea" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Editor de Texto</label>
      <button
        @click="text = ''"
        class="text-xs bg-slate-200 dark:bg-slate-700 hover:bg-red-500 hover:text-white dark:hover:bg-red-600 text-slate-700 dark:text-slate-300 px-3 py-1.5 rounded-lg transition-colors font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
        :disabled="text.length === 0"
        aria-label="Limpar caixa de texto"
      >
        Limpar
      </button>
    </div>
    <textarea
      id="wordcounter-textarea"
      x-model="text"
      class="w-full h-80 px-6 py-4 bg-transparent border-0 focus:ring-2 focus:ring-primary focus:outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 resize-y"
      placeholder="Cole ou digite seu texto aqui..."
    ></textarea>
  </div>
</section>
